[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prospectus-cli"
version = "0.1.0"
description = "The Prospectus command line, signed in through cli-login's remote sign-in."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Anthus AI" }]
# Pinned exactly: the pages Lambda and the broker stack run this same cli-login version.
dependencies = ["cli-login==0.3.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src", "build_pages_test.py"]
python_files = ["*_test.py"]
