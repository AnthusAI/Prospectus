version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --prefix amplify
        - node amplify/verify-scope.mjs
        - source .build/deployment.env
        - node infra/scripts/checkout-kanbus.mjs
        - npm ci --prefix .build/kanbus-ui/packages/ui
        - npm run build --prefix .build/kanbus-ui/packages/ui
        - npm ci
        - npm ci --prefix packages/accounts-client
        - npm run typecheck
        - npm test
        # The Anthus One portal app builds only its frontend; every backend step is Prospectus only.
        - if [ "$PROSPECTUS_APP" = "prospectus" ]; then bash infra/scripts/build-backend.sh; fi
        - if [ "$PROSPECTUS_APP" = "prospectus" ]; then node infra/scripts/build-evaluation-if-enabled.mjs; fi
        - if [ "$PROSPECTUS_APP" = "prospectus" ]; then node --import tsx accounts/build-deployment.ts; fi
        - if [ "$PROSPECTUS_APP" = "prospectus" ]; then npm ci --prefix infra && npm run check --prefix infra; fi
        - if [ "$PROSPECTUS_APP" = "prospectus" ]; then npm exec --prefix amplify -- ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"; fi
frontend:
  phases:
    preBuild:
      commands:
        - source .build/deployment.env
        - if [ "$PROSPECTUS_APP" = "portal" ]; then node infra/scripts/write-portal-env.mjs; else node infra/scripts/write-frontend-env.mjs; fi
    build:
      commands:
        - if [ "$PROSPECTUS_APP" = "portal" ]; then npx vite build --config vite.portal.config.ts --outDir ../dist --emptyOutDir; else npm run build; fi
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .build/target/**/*
      - .build/accounts-linux-target/**/*
      - amplify/node_modules/**/*
      - node_modules/**/*
