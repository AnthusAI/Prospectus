# Merge to main deploys once, after green CI: the deploy job starts the Amplify job for this exact
# commit through GitHub OIDC. Amplify's own auto-build on main is off, so nothing builds twice.
name: CI
on:
  push:
    branches: [develop, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            .build/target
            .build/intake-control-target
            .build/accounts-linux-target
            .build/kanbus
          key: rust-${{ runner.os }}-${{ hashFiles('source-lock.json', 'local-dependencies/intake-control/Cargo.lock', 'local-dependencies/intake-control/Cargo.toml', 'local-dependencies/intake-control/src/**', 'local-dependencies/intake-control/rust-toolchain.toml', 'scripts/build-accounts-linux.sh') }}
          restore-keys: |
            rust-${{ runner.os }}-
      - run: node infra/scripts/checkout-kanbus.mjs
      - run: npm ci --prefix .build/kanbus-ui/packages/ui
      - run: npm run build --prefix .build/kanbus-ui/packages/ui
      - run: npm ci
      - run: npm ci --prefix packages/accounts-client
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CLI and remote sign-in pages specs
        run: |
          python -m pip install --require-hashes -r cli/requirements-lambda.txt
          python -m pip install --no-deps -e cli
          python -m pip install pytest
          python -m pytest cli
          python -m pytest infra/lib/cli-rewrite
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify:bundles
      - run: npm ci --prefix infra
      - run: npm ci --prefix amplify
      - run: npm run check --prefix infra
      - run: npm run check:amplify --prefix infra
      - run: npm run synth:amplify-review --prefix infra
      - run: npm run synth:accounts:review --prefix infra
      - run: npm run synth:portal:review --prefix infra
      - run: bash infra/scripts/build-backend.sh
      - run: node infra/scripts/build-evaluation-if-enabled.mjs
      - run: node --import tsx accounts/build-deployment.ts
      - name: Verify the enabled Accounts package and persisted isolation
        run: |
          if node -e 'process.exit(require("./accounts/deployment.json").enabled ? 0 : 1)'; then
            PROSPECTUS_PACKAGE_NODE_MAJOR=24 node accounts/package-smoke.mjs
            mkdir -p .build/intake-control-target/debug
            ln -sfn "$PWD/.artifacts/canonical-accounts/identity-files" .build/intake-control-target/debug/prospectus-identity-files
            node --import tsx --test accounts/durable-accounts.test.ts accounts/durable-google-identities.test.ts accounts/directory.test.ts accounts/execution-delegation.test.ts accounts/identity-files-session.test.ts accounts/google-direct-durable.test.ts accounts/account-creation-limit.test.ts accounts/site-subjects-durable.test.ts accounts/identity-session-lookup.test.ts
          fi
      - run: bash infra/scripts/test-browser-ci.sh
      - run: PROSPECTUS_ACCOUNTS_UI=1 node --import tsx --test test/accounts-directory-ui.test.ts test/portal-ui.test.ts
      - name: Verify the persisted Accounts browser flow when enabled
        run: |
          if node -e 'process.exit(require("./accounts/deployment.json").enabled ? 0 : 1)'; then
            PROSPECTUS_ACCOUNTS_UI=1 node --import tsx --test test/accounts-persisted-ui.test.ts
          fi
  deploy:
    needs: application
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    uses: AnthusAI/Papyrus/.github/workflows/amplify-deploy.yml@main
    with:
      app-id: d15sc1sptohtqb
      role-to-assume: arn:aws:iam::712236451410:role/prospectus-github-deploy
